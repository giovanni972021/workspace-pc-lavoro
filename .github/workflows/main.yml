name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    # Impostiamo il percorso relativo corretto partendo dalla root del repo
    defaults:
      run:
        working-directory: "esercizi JAVA e SPRING/00 esercizi spring/programma_20_2_26"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Maven cercherà il pom.xml nella working-directory impostata sopra
      run: mvn -B package

    - name: Run Tests
      run: mvn test
